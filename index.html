<!doctype html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kentunc.org</title>
    <meta
      name="description"
      content="Kensuke Taguchi — a software engineer. Profile, career and links."
    />
    <meta name="theme-color" content="#2a303c" />
    <link rel="canonical" href="https://kentunc.org/" />
    <script>
      // Apply the stored color mode before the first paint so switching to
      // light mode does not flash dark. Keep in sync with src/lib/color-mode.ts.
      try {
        if (localStorage.getItem('color-mode') === 'light') {
          document.documentElement.dataset.theme = 'nord';
        }
      } catch (error) {
        // Storage is unavailable; fall back to the default dark mode.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script prerender type="module" src="/src/main.tsx"></script>
  </body>
</html>
