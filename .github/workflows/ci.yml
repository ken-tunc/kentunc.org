name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.tool-versions'
          cache: true
      # Format, lint and type check in one pass.
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
